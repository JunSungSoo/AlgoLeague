name: Release container
on:
    push:
        tags: ["v*"]
permissions:
    contents: read
    packages: write
jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ghcr.io/${{ github.repository }}-web:${{ github.ref_name }}
                  provenance: true
                  sbom: true
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: algorithm-champions-back/Dockerfile
                  push: true
                  tags: ghcr.io/${{ github.repository }}-back:${{ github.ref_name }}
                  provenance: true
                  sbom: true
